<div class="auth-page">

  <div class="auth-glow"></div>

  <div class="auth-container">

    <a class="logo" routerLink="/">
      <svg viewBox="0 0 42 42" aria-hidden="true">
        <polygon
          points="21,3 39,21 21,39 3,21"
          fill="#F4C542"
        />
        <polygon
          points="21,11 31,21 21,31 11,21"
          fill="#090C10"
        />
      </svg>

      <span>quick<span>desk</span></span>
    </a>

    <div class="auth-card">

      <div class="auth-heading">

        <span class="eyebrow">
          GET STARTED
        </span>

        <h1>
          Create your account
        </h1>

        <p>
          Start managing your team's work with QuickDesk.
        </p>

      </div>

      <form
        #signupForm="ngForm"
        (ngSubmit)="createAccount()"
      >

        <div class="form-group">

          <label for="name">
            Full name
          </label>

          <input
            id="name"
            name="name"
            type="text"
            placeholder="Your name"
            autocomplete="name"
            [(ngModel)]="name"
            required
          />

        </div>

        <div class="form-group">

          <label for="email">
            Work email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@company.com"
            autocomplete="email"
            [(ngModel)]="email"
            required
          />

        </div>

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            placeholder="Create a password"
            autocomplete="new-password"
            [(ngModel)]="password"
            required
            minlength="8"
          />

        </div>

        @if (error) {
          <div class="auth-error">
            {{ error }}
          </div>
        }

        <button
          type="submit"
          class="login-button"
          [disabled]="loading"
        >

          @if (loading) {
            Creating Account...
          } @else {
            Create Account
            <span>→</span>
          }

        </button>

      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <p class="signup-text">

        Already have an account?

        <a routerLink="/login">
          Log in
        </a>

      </p>

    </div>

    <p class="auth-footer">
      © 2026 QuickDesk. All rights reserved.
    </p>

  </div>

</div>
