<div class="auth-page">

  <div class="auth-glow"></div>

  <div class="auth-container">

    <a class="logo" routerLink="/">
      <svg viewBox="0 0 42 42" aria-hidden="true">
        <polygon points="21,3 39,21 21,39 3,21" fill="#F4C542" />

        <polygon points="21,11 31,21 21,31 11,21" fill="#090C10" />
      </svg>

      <span>quick<span>desk</span></span>
    </a>

    <div class="auth-card">

      <div class="auth-heading">

        <span class="eyebrow">
          WELCOME BACK
        </span>

        <h1>
          Log in to QuickDesk
        </h1>

        <p>
          Access your workspace and keep your team moving.
        </p>

      </div>

      <form #loginForm="ngForm" (ngSubmit)="login()">

        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <input id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email"
            [(ngModel)]="email" required />

        </div>
        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input id="password" name="password" [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter your password" autocomplete="current-password" [(ngModel)]="password" required />

            <button type="button" class="password-toggle" (click)="togglePassword()" aria-label="Show or hide password">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                <circle cx="12" cy="12" r="2.5" />
              </svg>
            </button>

          </div>

        </div>

        @if (error) {

        <div class="auth-error">
          {{ error }}
        </div>

        }


        <button type="submit" class="login-button" [disabled]="loading || loginForm.invalid">

          @if (loading) {

          Logging in...

          } @else {

          Log In
          <span>→</span>

          }

        </button>

      </form>


      <div class="divider">
        <span>OR</span>
      </div>


      <p class="signup-text">

        Don't have an account?

        <a routerLink="/signup">
          Create account
        </a>

      </p>

    </div>


    <p class="auth-footer">
      © 2026 QuickDesk. All rights reserved.
    </p>

  </div>

</div>
